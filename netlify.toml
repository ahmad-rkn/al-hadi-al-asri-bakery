[build]
  # Regenerates js/supabase-config.js from the SUPABASE_URL / SUPABASE_ANON_KEY
  # environment variables (Site settings -> Environment variables) before
  # every deploy. No dependencies required — build.js uses only Node's
  # built-in "fs" module.
  command = "node build.js"
  publish = "."

[[headers]]
  for = "/admin/*"
  [headers.values]
    # Admin panel pages should never be cached or indexed by search engines.
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
